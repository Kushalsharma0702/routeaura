[project]
name = "routeaura-backend"
version = "0.1.0"
description = "RouteAura API (modular monolith)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.9,<3",
    "httpx>=0.27,<1",
    "ortools>=9.10,<10",
    "networkx>=3.3,<4",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
filterwarnings = ["error::DeprecationWarning:app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501"]
"app/scripts/seed_catalog.py" = ["E501"]
"app/modules/recommendations/evaluation/*" = ["E501"]
"app/modules/itinerary/llm_planning.py" = ["E501"]
"app/modules/itinerary/evaluation.py" = ["E501"]
"app/modules/routing/*" = ["E501"]
"app/modules/routing/evaluation.py" = ["E501", "B023", "B007"]
"app/modules/context/*" = ["E501"]
"app/modules/bookings/*" = ["E501"]
"app/workers/*" = ["E501"]
"app/modules/assistant/*" = ["E501"]
"app/models/booking.py" = ["E501"]
"app/core/config.py" = ["E501"]
